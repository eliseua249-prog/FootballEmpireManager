name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.5"
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_ROOT: /usr/lib/android-sdk

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -eux
          apt-get update
          apt-get install -y curl unzip

      - name: Install Godot export templates
        shell: bash
        run: |
          set -eux
          dir="$HOME/.local/share/godot/export_templates/4.5.stable"
          mkdir -p "$dir"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz" -o /tmp/templates.tpz
          rm -rf /tmp/templates
          mkdir -p /tmp/templates
          unzip -o /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$dir/"
          test -s "$dir/android_debug.apk"
          test -s "$dir/android_release.apk"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -eux
          sdkmanager=/usr/lib/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager
          yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"
          java_bin="$(command -v java)"
          java_home="$(dirname "$(dirname "$(readlink -f "$java_bin")")")"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -eux
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/java_sdk_path = "$JAVA_HOME"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
          cat "$HOME/.config/godot/editor_settings-4.5.tres"

      - name: Verify Godot and Android
        shell: bash
        run: |
          set -eux
          godot --headless --version
          test -x "$ANDROID_HOME/build-tools/35.0.1/aapt"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -s "$HOME/.android/debug.keystore"

      - name: Build Android APK
        shell: bash
        run: |
          set -eux
          rm -rf build
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/FootballEmpireManager.apk
          test -s build/FootballEmpireManager.apk
          ls -lh build/FootballEmpireManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballEmpireManager-APK
          path: build/FootballEmpireManager.apk
