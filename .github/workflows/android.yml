name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.5
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_ROOT: /usr/lib/android-sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install download tools
        run: |
          set -e
          apt-get update
          apt-get install -y curl unzip

      - name: Install Godot export templates
        run: |
          set -e
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ]; then
            mkdir -p /tmp/godot-templates
            curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/godot-templates/export_templates.tpz
            unzip -o /tmp/godot-templates/export_templates.tpz -d /tmp/godot-templates/unpacked
            cp -a /tmp/godot-templates/unpacked/templates/. "$TEMPLATE_DIR/"
          fi
          ls -lh "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Configure Android SDK and Java
        run: |
          set -e
          SDKMANAGER=/usr/lib/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager
          yes | "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

          JAVA_BIN="$(command -v java)"
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          set -e
          godot --headless --version
          test -x "$ANDROID_HOME/build-tools/35.0.1/aapt"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/ndk/28.1.13356709"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -s "$HOME/.android/debug.keystore"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

      - name: Build Android APK
        run: |
          set -e
          rm -rf build
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/FootballEmpireManager.apk
          test -s build/FootballEmpireManager.apk
          ls -lh build/FootballEmpireManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballEmpireManager-APK
          path: build/FootballEmpireManager.apk
