name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.5
  ANDROID_HOME: /usr/lib/android-sdk
  ANDROID_SDK_ROOT: /usr/lib/android-sdk

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/godot
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot/. ~/.config/godot/
          fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/
          fi

      - name: Configure Android SDK and Java for Godot
        run: |
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=/usr/lib/android-sdk/cmdline-tools/cmdline-tools/bin/sdkmanager
          yes | "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root=/usr/lib/android-sdk "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest"

          JAVA_BIN="$(command -v java)"
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$JAVA_BIN")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "Using Java: $JAVA_HOME"
          java -version

          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi

          SETTINGS="$HOME/.config/godot/editor_settings-4.5.tres"
          touch "$SETTINGS"
          sed -i '/export\/android\/android_sdk_path/d' "$SETTINGS"
          sed -i '/export\/android\/java_sdk_path/d' "$SETTINGS"
          printf '\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\n' >> "$SETTINGS"
          printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME" >> "$SETTINGS"

      - name: Verify Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          test -x "$ANDROID_HOME/build-tools/35.0.1/aapt"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -f "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android >/dev/null
          godot --headless --version

      - name: Build Android APK
        run: |
          rm -rf build
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/FootballEmpireManager.apk
          test -s build/FootballEmpireManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballEmpireManager-APK
          path: build/FootballEmpireManager.apk
